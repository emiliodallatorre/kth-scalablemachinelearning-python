[project]
name = "kth-scalablemachinelearning-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Emilio Dalla Torre", email = "info@emiliodallatorre.it" }
]
requires-python = "==3.10.*"
dependencies = [
    "ipykernel>=6.29",
    "jupyterlab>=4.0,<5",
    "matplotlib>=3.7,<4",
    "numpy<2",
    "scikit-learn>=1.3,<1.6",
    "torch==2.2.2",
    "torchvision==0.17.2",
]

[project.scripts]
kth-scalablemachinelearning-python = "kth_scalablemachinelearning_python:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
